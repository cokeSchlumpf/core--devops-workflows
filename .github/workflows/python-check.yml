name: Python Check

# Reusable workflow: installs the project with Poetry, runs its checks and builds the documentation.
# The project defines what is checked via its `poe check` and `poe docs-build` tasks.
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.14"
      poetry-version:
        type: string
        default: "2.5.1"
      install-args:
        description: Arguments for `poetry install`.
        type: string
        default: "--all-extras --with docs"
      docs:
        description: Also build the documentation with `poe docs-build`.
        type: boolean
        default: true
      private-repositories:
        description: Private GitHub repositories (owner/name, separated by spaces) that dependencies are installed from, with the deploy key in the secret `GIT_SSH_KEY`.
        type: string
        default: ""
    secrets:
      GIT_SSH_KEY:
        description: A read-only deploy key of the repositories in `private-repositories`.
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==${{ inputs.poetry-version }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry

      - name: Set up access to private dependencies
        if: ${{ inputs.private-repositories != '' }}
        env:
          GIT_SSH_KEY: ${{ secrets.GIT_SSH_KEY }}
          REPOSITORIES: ${{ inputs.private-repositories }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GIT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          for repository in $REPOSITORIES; do
            git config --global url."git@github.com:${repository}.git".insteadOf "https://github.com/${repository}.git"
          done
          echo "POETRY_SYSTEM_GIT_CLIENT=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: poetry install ${{ inputs.install-args }}

      - name: Run checks
        run: poetry run poe check

      - name: Build documentation
        if: ${{ inputs.docs }}
        run: poetry run poe docs-build
