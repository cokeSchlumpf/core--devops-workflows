name: Python Check

# Reusable workflow: installs the project with Poetry, runs its checks and builds the documentation.
# The project defines what is checked via its `poe check` and `poe docs-build` tasks.
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.14"
      poetry-version:
        type: string
        default: "2.5.1"
      install-args:
        description: Arguments for `poetry install`.
        type: string
        default: "--all-extras --with docs"
      docs:
        description: Also build the documentation with `poe docs-build`.
        type: boolean
        default: true
      private-repositories:
        description: Private GitHub repositories (owner/name, separated by spaces) that dependencies are installed from, with the deploy key in the secret `GIT_SSH_KEY`, or for several repositories one per repository in `GIT_SSH_KEYS`.
        type: string
        default: ""
    secrets:
      GIT_SSH_KEY:
        description: A read-only deploy key of the repository in `private-repositories`.
        required: false
      GIT_SSH_KEYS:
        description: Read-only deploy keys, as a JSON object from owner/name to the private key, as a deploy key serves one repository.
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==${{ inputs.poetry-version }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry

      - name: Set up access to private dependencies
        if: ${{ inputs.private-repositories != '' }}
        env:
          GIT_SSH_KEY: ${{ secrets.GIT_SSH_KEY }}
          GIT_SSH_KEYS: ${{ secrets.GIT_SSH_KEYS }}
          REPOSITORIES: ${{ inputs.private-repositories }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          index=0
          for repository in $REPOSITORIES; do
            index=$((index + 1))
            if [ -n "$GIT_SSH_KEYS" ]; then
              key="$(jq -r --arg repository "$repository" '.[$repository] // empty' <<< "$GIT_SSH_KEYS")"
            else
              key="$GIT_SSH_KEY"
            fi
            printf '%s\n' "$key" > ~/.ssh/key_$index
            chmod 600 ~/.ssh/key_$index
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/key_%s\n  IdentitiesOnly yes\n' "$index" "$index" >> ~/.ssh/config
            git config --global url."git@github-${index}:${repository}.git".insteadOf "https://github.com/${repository}.git"
          done
          echo "POETRY_SYSTEM_GIT_CLIENT=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: poetry install ${{ inputs.install-args }}

      - name: Run checks
        run: poetry run poe check

      - name: Build documentation
        if: ${{ inputs.docs }}
        run: poetry run poe docs-build
