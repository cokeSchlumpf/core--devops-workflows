name: Python Docs

# Reusable workflow: builds the documentation with `poe docs-build` and deploys it to GitHub Pages.
# The caller must grant `pages: write` and `id-token: write`.
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      poetry-version:
        type: string
        default: "2.1.3"
      install-args:
        description: Arguments for `poetry install`.
        type: string
        default: "--all-extras --with docs"
      site-dir:
        description: Output directory of `poe docs-build`.
        type: string
        default: site

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==${{ inputs.poetry-version }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install ${{ inputs.install-args }}

      - name: Build documentation
        run: poetry run poe docs-build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.site-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
