name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/python-release.yml
    secrets: inherit
    with:
      # Use the polish action of this very commit instead of the latest release.
      workflows-ref: ${{ github.sha }}
